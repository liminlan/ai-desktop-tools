<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 聚合助手</title>
<link rel="icon" href="assets/app-icon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<style>
:root{
  --bg:#0b0d12; --panel:#10131a; --panel2:#171b23; --panel3:#1d222c;
  --line:#252b37; --text:#e9edf5; --sub:#8b93a6; --sub2:#5d6577;
  --accent:#4d6bfe; --accent2:#7c5cff;
  --ok:#31c48d; --warn:#f5a623; --err:#f05252;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#262b35;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#333a47}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:var(--text)}
input,textarea,select{font-family:inherit;font-size:14px;outline:none}
.app{display:flex;height:100vh;width:100vw}

/* ============ 侧边栏 ============ */
.sidebar{width:272px;flex:0 0 272px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand-logo{width:34px;height:34px;border-radius:10px;flex:0 0 34px;overflow:hidden;box-shadow:0 4px 14px rgba(77,107,254,.35)}.brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-size:15px;font-weight:600}
.brand-sub{font-size:11px;color:var(--sub2);margin-top:2px}

.new-chat-btn{margin:0 12px 8px;height:38px;border-radius:10px;background:var(--panel3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:#cfd6e6;transition:.15s}
.new-chat-btn:hover{background:#242a35;border-color:#333b4a;color:#fff}

.search-box{margin:0 12px 6px;position:relative}
.search-box input{
  width:100%;height:32px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:0 10px 0 30px;color:var(--text);font-size:12.5px;
}
.search-box input::placeholder{color:var(--sub2)}
.search-box svg{position:absolute;left:9px;top:9px;color:var(--sub2)}

.side-scroll{flex:1;overflow-y:auto;padding:4px 10px 10px}
.side-label{font-size:11px;color:var(--sub2);letter-spacing:.8px;padding:11px 6px 6px;display:flex;align-items:center;justify-content:space-between}
.side-label .mini{font-size:11px;color:var(--sub);letter-spacing:0;cursor:pointer}
.side-label .mini:hover{color:var(--accent)}

.model-list{display:flex;flex-direction:column;gap:2px}
.model-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.13s;position:relative}
.model-item:hover{background:#191e27}
.model-item.active{background:linear-gradient(90deg,rgba(77,107,254,.16),rgba(124,92,255,.08));box-shadow:inset 0 0 0 1px rgba(77,107,254,.3)}
.model-item .m-name{font-size:13px;font-weight:500}
.model-item .m-brand{font-size:10.5px;color:var(--sub2);margin-top:1px}
.m-dot{width:6px;height:6px;border-radius:50%;background:var(--sub2);flex:0 0 6px}
.m-dot.on{background:var(--ok);box-shadow:0 0 6px rgba(49,196,141,.7)}
.pick-box{width:15px;height:15px;border-radius:5px;border:1px solid #38404f;flex:0 0 15px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.pick-box.on{background:var(--accent);border-color:var(--accent)}

.conv-list{display:flex;flex-direction:column;gap:1px;min-height:20px}
.conv-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:#b9c0d0;font-size:12.5px;transition:.12s}
.conv-item:hover{background:#191e27;color:#fff}
.conv-item.active{background:#191e27;color:#fff;box-shadow:inset 0 0 0 1px #2a3242}
.conv-item .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.conv-item .meta{font-size:10px;color:var(--sub2);flex:0 0 auto}
.conv-item .acts{display:none;gap:2px}
.conv-item:hover .acts{display:flex}
.conv-item .acts button{font-size:11px;color:var(--sub2);padding:1px 4px;border-radius:4px}
.conv-item .acts button:hover{background:#2a3040;color:#fff}
.avatars{display:flex;flex:0 0 auto}
.avatars .av{width:20px;height:20px;flex:0 0 20px;border-radius:6px;margin-right:-5px}
.empty-tip{font-size:12px;color:var(--sub2);padding:10px 8px;line-height:1.7}

.side-footer{border-top:1px solid var(--line);padding:8px;display:flex;gap:6px}
.side-footer button{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--sub);border:1px solid transparent;transition:.13s}
.side-footer button:hover{background:#191e27;color:#fff;border-color:var(--line)}

/* ============ 主区域 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(11,13,18,.75);backdrop-filter:blur(8px)}
.cur-model{display:flex;align-items:center;gap:9px;min-width:0}
.cur-model .tag{font-size:11.5px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{font-size:12px;padding:5px 12px;border-radius:8px;color:var(--sub);transition:.14s;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,#4d6bfe,#7c5cff);color:#fff;box-shadow:0 2px 10px rgba(77,107,254,.3)}
.top-actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:.13s}
.icon-btn:hover{background:var(--panel2);color:#fff}

.chat-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.chat-inner{max-width:900px;margin:0 auto;padding:22px 24px 10px;display:flex;flex-direction:column;gap:18px}
.chat-inner.wide{max-width:1360px}

/* 欢迎页 */
.welcome{padding:26px 0 0;text-align:center;animation:fade .4s ease}
.welcome h1{font-size:26px;font-weight:650;letter-spacing:.4px;line-height:1.45}
.welcome h1 em{font-style:normal;background:linear-gradient(120deg,#4d6bfe,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--sub);font-size:13.5px;margin-top:10px;line-height:1.85}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px;margin-top:24px;text-align:left}
.mg-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;text-align:left;min-height:66px}
.mg-card:hover{background:var(--panel2);border-color:#333c4d;transform:translateY(-1px)}
.mg-card .txt{min-width:0}
.mg-card .txt .n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-card .txt .s{font-size:10.5px;color:var(--sub2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-card .need{font-size:10px;color:var(--warn)}

/* 图标 */
.av{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:#f6f8fb;border:1px solid rgba(255,255,255,.14);overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av img.contain{object-fit:contain;padding:7px}
.av .mark{font-weight:700;font-size:14px;color:#fff}
.av.sm{width:28px;height:28px;flex:0 0 28px;border-radius:8px}
.av.sm img.contain{padding:5px}
.av.sm .mark{font-size:11px}
.av.lg{width:44px;height:44px;flex:0 0 44px;border-radius:12px}
.av.lg img.contain{padding:8px}
.av.tiny{width:20px;height:20px;flex:0 0 20px;border-radius:6px}
.av.tiny img.contain{padding:3px}

/* 消息 */
.msg{display:flex;gap:11px;animation:fade .25s ease}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:linear-gradient(135deg,#2b3a7a,#3a2f6b);border:1px solid #3c4a85;max-width:78%;padding:11px 15px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ai-head .name{font-size:12.5px;color:var(--sub);font-weight:500}
.ai-head .mdl{font-size:10.5px;color:var(--sub2);border:1px solid var(--line);padding:1px 6px;border-radius:10px}
.bubble{font-size:14px;line-height:1.85;word-break:break-word;color:#dfe4ef;; }
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{margin:14px 0 8px;font-weight:600;line-height:1.5}
.bubble h1{font-size:18px}.bubble h2{font-size:16px}.bubble h3{font-size:15px}
.bubble ul,.bubble ol{margin:6px 0 10px;padding-left:22px}
.bubble li{margin:3px 0}
.bubble code{background:#1b2029;border:1px solid #262d3a;border-radius:5px;padding:1px 5px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:#a8c7ff}
.bubble pre{background:#0e1420;border:1px solid #202a3d;border-radius:10px;padding:12px 14px;overflow-x:auto;margin:10px 0}
.bubble pre code{background:none;border:none;padding:0;color:#c8d6ef;font-size:12.5px;line-height:1.7}
.bubble a{color:#7ea6ff}
.bubble blockquote{border-left:2px solid #3b4658;padding:2px 0 2px 12px;color:var(--sub);margin:8px 0}
.bubble table{border-collapse:collapse;margin:10px 0;font-size:13px}
.bubble th,.bubble td{border:1px solid #2b3341;padding:6px 10px}
.bubble th{background:#1a1e26}
.msg-tools{display:flex;gap:4px;margin-top:8px;opacity:0;transition:.15s}
.msg:hover .msg-tools{opacity:1}
.mini-btn{font-size:11.5px;color:var(--sub);padding:3px 8px;border-radius:6px;border:1px solid transparent}
.mini-btn:hover{background:var(--panel2);color:#fff}
.err-box{background:rgba(240,82,82,.1);border:1px solid rgba(240,82,82,.35);border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.7;color:#ffb3b3;white-space:pre-wrap}
.cursor{display:inline-block;width:7px;height:15px;background:#7ea6ff;border-radius:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:2px}

/* 协同 */
.turn{display:flex;flex-direction:column;gap:14px;animation:fade .25s}
.multi-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.ans-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;min-width:0}
.ans-card .hd{display:flex;align-items:center;gap:8px;padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid #20263200}
.ans-card .hd .nm{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans-card .hd .st{font-size:10.5px;color:var(--sub2)}
.ans-card .bd{font-size:13.5px;line-height:1.8;color:#dbe1ec}
.ans-card .bd .bubble{font-size:13.5px}
.ans-card.pending{border-style:dashed}
.sum-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.sum-bar .who{font-size:11.5px;color:var(--sub2)}
.sum-bar select{background:var(--panel3);border:1px solid var(--line);color:#cbd3e4;font-size:11.5px;padding:4px 22px 4px 8px;border-radius:7px;appearance:none}
.sum-card{background:linear-gradient(180deg,rgba(77,107,254,.08),rgba(124,92,255,.04));border:1px solid rgba(77,107,254,.3);border-radius:13px;padding:14px 16px}
.sum-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sum-card .hd .t{font-size:12.5px;font-weight:600;color:#c5d0ff}

/* ---------- 工作流 ---------- */
.flow-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 2px 9px}
.flow-bar .lbl{font-size:11.5px;color:var(--sub2);white-space:nowrap}
#flowSelect{appearance:none;background:var(--panel3);border:1px solid var(--line);color:#cbd3e4;
  font-size:11.5px;padding:4px 24px 4px 9px;border-radius:7px;cursor:pointer}
.flow-steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--sub2);width:100%}
.fs-chip{border:1px solid var(--line);border-radius:20px;padding:2px 8px;background:var(--panel);color:#9aa3b8}
.fs-chip i{font-style:normal;color:var(--sub2);margin-left:4px}
.fs-arrow{color:var(--sub2)}
.ref-input{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:5px 9px;color:var(--text);font-size:11.5px}
.ref-input::placeholder{color:var(--sub2)}
.flow-card{background:linear-gradient(180deg,rgba(77,107,254,.07),rgba(124,92,255,.03));
  border:1px solid rgba(77,107,254,.24);border-radius:14px;padding:16px 16px 4px}
.flow-step{display:flex;gap:10px;padding-bottom:16px}
.fs-rail{flex:0 0 22px;display:flex;justify-content:center}
.fs-num{width:20px;height:20px;border-radius:50%;background:var(--panel3);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.flow-step.final .fs-num{background:linear-gradient(135deg,#4d6bfe,#7c5cff);border-color:transparent;color:#fff;font-weight:600}
.fs-body{flex:1;min-width:0}
.fs-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.fs-hd .nm{font-size:12.5px;font-weight:600;color:#d6dceb}
.fs-hd .mdl{font-size:10.5px;color:var(--sub2);border:1px solid var(--line);padding:1px 6px;border-radius:10px}
.fs-hd .st{font-size:10.5px;color:var(--sub2);margin-left:auto}
.flow-step.final .fs-hd .st{color:var(--ok)}
.fs-bd .bubble{font-size:13.5px}
.flow-step.final .fs-bd .bubble{color:#eef1f8}
.flow-edit{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px}
.flow-edit .top{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.flow-edit .top input{flex:1;background:#222836;border:1px solid #333c4d;border-radius:8px;
  padding:6px 10px;color:var(--text);font-size:13px}
.step-edit{border:1px dashed #2b3341;border-radius:9px;padding:9px;margin-bottom:8px}
.step-edit .row{display:flex;gap:6px;margin-bottom:6px}
.step-edit .row input{flex:1;background:#222836;border:1px solid #333c4d;border-radius:7px;
  padding:5px 8px;color:var(--text);font-size:12px}
.step-edit .row select{background:#222836;border:1px solid #333c4d;border-radius:7px;
  padding:5px 6px;color:#cbd3e4;font-size:11.5px}
.step-edit textarea{width:100%;background:#222836;border:1px solid #333c4d;border-radius:7px;
  padding:7px 8px;color:var(--text);font-size:12px;min-height:56px;resize:vertical;line-height:1.6}

/* ---------- 附件 / 语音 / 生图 ---------- */
.attach-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px 8px}
.mic-bar{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:0 2px 8px;background:#1b2130;border:1px solid #2b3242;border-radius:10px;font-size:12px;color:#cbd3e4}
.mic-bar .dot{width:8px;height:8px;border-radius:50%;background:#ff5b5b;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.mic-bar .grow{flex:1;color:#8f9bb3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mic-bar .stop{font-size:11.5px;color:#ff8b8b;cursor:pointer;border:1px solid #4a2a2a;border-radius:7px;padding:2px 9px}
.img-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 2px 8px;font-size:12px;color:#8f9bb3}
.size-chip{font-size:11.5px;color:#9aa6bd;background:#1c2230;border:1px solid #2b3242;border-radius:8px;padding:4px 11px;cursor:pointer;transition:.15s}
.size-chip.on{color:#fff;background:linear-gradient(135deg,#4d6bfe,#7c5cff);border-color:transparent}
.img-ref-chip{display:inline-flex;align-items:center;gap:6px;background:#1c2230;border:1px solid #2b3242;border-radius:8px;padding:3px 6px 3px 4px}
.img-ref-chip img{width:26px;height:26px;object-fit:cover;border-radius:5px;display:block}
.img-ref-chip .x{cursor:pointer;color:#8f9bb3;padding:0 3px}
.img-ref-chip .x:hover{color:#ff8b8b}
.tool-trace{display:flex;flex-direction:column;gap:5px;margin:0 0 9px;padding:8px 10px;background:#161c27;border:1px solid #262e3d;border-radius:9px}
.tool-trace .tl{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:#9aa6bd;line-height:1.5}
.tool-trace .tl b{color:#cfd6e6;font-weight:500}
.tool-trace .tl.done .ic{color:#4ecf8f}
.tool-trace .tl.run .ic{color:#e8b34a}
.read-btn{font-size:11.5px;padding:3px 9px}
.att-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:5px 8px;font-size:11.5px;color:#b7c0d3;max-width:280px}
.att-chip img{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}
.att-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.att-chip .rm{cursor:pointer;color:var(--sub2);font-size:13px;line-height:1;padding:0 2px}
.att-chip .rm:hover{color:#ff7a7a}
.ref-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#b9c3d6;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:3px 9px;margin-top:8px;margin-right:6px}
.ref-chip b{font-weight:500;color:#e2e7f2}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);
  color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:.15s}
.icon-btn:hover{color:#dfe5f2;border-color:#3a4354}
.icon-btn.on{color:#fff;background:linear-gradient(135deg,#4d6bfe,#7c5cff);border-color:transparent}
.icon-btn.rec{color:#fff;background:#e5484d;border-color:transparent;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 7px rgba(229,72,77,0)}}
.msg.user .bubble .att-inline{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.msg.user .bubble .att-inline img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.gen-grid{display:grid;grid-template-columns:1fr;gap:14px}
.gen-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;align-self:flex-start;max-width:100%}
.gen-card .hd{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub2);margin-bottom:9px}
.gen-card .hd b{color:#cfd6e6;font-weight:600}
.gen-card img{width:auto;height:auto;max-width:100%;max-height:56vh;object-fit:contain;border-radius:10px;display:block;cursor:zoom-in;margin:0 auto;background:#0d1017}
.gen-card .ft{display:flex;gap:7px;margin-top:9px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#242b3a;border:1px solid var(--line);
  color:#e7ebf5;font-size:12.5px;padding:9px 15px;border-radius:10px;z-index:10001;max-width:70vw;
  box-shadow:0 8px 26px rgba(0,0,0,.45);animation:toastIn .18s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.param-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12.5px;color:#c3cad9}
.param-row input[type=range]{flex:1;accent-color:#4d6bfe}
.param-row input[type=number]{background:#222836;border:1px solid #333c4d;border-radius:8px;
  padding:6px 9px;color:var(--text);font-size:12.5px;width:110px}
.param-row select{background:#222836;border:1px solid #333c4d;border-radius:8px;padding:6px 9px;
  color:var(--text);font-size:12.5px;min-width:120px;max-width:340px;width:auto}
.stat-box{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:12.5px;
  color:#b7c0d3;line-height:2}



/* 输入区 */
.composer-wrap{padding:6px 24px 14px;max-width:948px;margin:0 auto;width:100%}
.composer-wrap.wide{max-width:1408px}
.multi-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 2px 9px}
.multi-bar .lbl{font-size:11.5px;color:var(--sub2)}
.p-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 4px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--sub);transition:.13s}
.p-chip .av{width:19px;height:19px;flex:0 0 19px;border-radius:6px}
.p-chip .av img.contain{padding:3px}
.p-chip.on{border-color:rgba(77,107,254,.55);background:rgba(77,107,254,.14);color:#b9c6ff}
.skill-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px}
.skill-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--sub);background:var(--panel);transition:.13s}
.skill-chip:hover{border-color:#3a4457;color:#fff}
.skill-chip.on{border-color:rgba(77,107,254,.55);background:rgba(77,107,254,.14);color:#b9c6ff}
.composer{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;transition:.15s}
.composer:focus-within{border-color:#3c4a7a;box-shadow:0 0 0 3px rgba(77,107,254,.1)}
#input{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;line-height:1.7;resize:none;max-height:190px;padding:4px 2px 8px}
#input::placeholder{color:var(--sub2)}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cb-left{display:flex;align-items:center;gap:8px;min-width:0}
.cb-right{display:flex;align-items:center;gap:6px}
.cb-tag{font-size:11.5px;color:#9aa6bd;background:var(--panel3);border:1px solid var(--line);padding:5px 10px;border-radius:8px;white-space:nowrap}
.sel-wrap{position:relative;display:flex;align-items:center}
#modelSelect{appearance:none;background:var(--panel3);border:1px solid var(--line);color:#cbd3e4;font-size:12px;padding:5px 26px 5px 10px;border-radius:8px;cursor:pointer;max-width:250px}
.sel-wrap::after{content:"﹀";position:absolute;right:9px;font-size:10px;color:var(--sub);pointer-events:none}
.send-btn{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#4d6bfe,#7c5cff);display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 4px 12px rgba(77,107,254,.3)}
.send-btn:hover{filter:brightness(1.1)}
.send-btn.stop{background:linear-gradient(135deg,#f05252,#c93c3c)}
.hint{font-size:11px;color:var(--sub2);text-align:center;margin-top:8px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;animation:fade .18s}
.modal{width:660px;max-width:94vw;max-height:88vh;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.65);animation:pop .2s ease}
.modal.wide{width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:15px;font-weight:600}
.modal-head .x{width:30px;height:30px;border-radius:8px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.modal-head .x:hover{background:var(--panel2);color:#fff}
.tabs{display:flex;gap:4px;padding:12px 18px 0}
.tab{font-size:12.5px;color:var(--sub);padding:6px 12px;border-radius:8px}
.tab:hover{color:#fff;background:var(--panel2)}
.tab.on{background:rgba(77,107,254,.16);color:#b9c6ff}
.modal-body{flex:1;overflow-y:auto;padding:14px 20px 20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13px}
.field input:focus,.field textarea:focus{border-color:#3c4a7a}
.field textarea{resize:vertical;min-height:76px;line-height:1.7}
.field .tip{font-size:11px;color:var(--sub2);margin-top:5px;line-height:1.6}
.field .tip a{color:#7ea6ff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.api-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.api-card .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.api-card .head .meta{flex:1}
.api-card .head .meta .n{font-size:13.5px;font-weight:600}
.api-card .head .meta .s{font-size:11px;color:var(--sub2);margin-top:2px}
.badge{font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--sub)}
.badge.ok{color:var(--ok);border-color:rgba(49,196,141,.4);background:rgba(49,196,141,.1)}
.btn{padding:8px 16px;border-radius:9px;font-size:13px;background:var(--panel3);border:1px solid var(--line);color:#cfd6e6;transition:.13s}
.btn:hover{background:#262c38;color:#fff}
.btn.primary{background:linear-gradient(135deg,#4d6bfe,#7c5cff);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(77,107,254,.28)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn.danger{color:#ff9b9b;border-color:rgba(240,82,82,.35)}
.test-result{font-size:11.5px;margin-top:8px;line-height:1.6;white-space:pre-wrap}

.skill-edit{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
.skill-edit .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.skill-edit .top input{flex:1;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px}
.skill-edit textarea{width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12.5px;min-height:70px;line-height:1.7;resize:vertical}

.hist-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid transparent}
.hist-row:hover{background:var(--panel2);border-color:var(--line)}
.hist-row .info{flex:1;min-width:0}
.hist-row .info .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .info .m{font-size:10.5px;color:var(--sub2);margin-top:3px}
.hist-row .acts{display:flex;gap:4px}

.help h3{font-size:13.5px;margin:16px 0 8px;color:#cfd6e6}
.help p,.help li{font-size:12.5px;color:var(--sub);line-height:1.9}
.help ol,.help ul{padding-left:20px}
.help .step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.help a{color:#7ea6ff}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (max-width:860px){
  .sidebar{position:absolute;z-index:20;height:100%;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .chat-inner{padding:16px 14px}
  .composer-wrap{padding:6px 14px 12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="assets/app-icon.png" alt="AI 聚合助手"></div>
      <div>
        <div class="brand-name">AI 聚合助手</div>
        <div class="brand-sub">一个界面，用遍各大模型</div>
      </div>
    </div>
    <button class="new-chat-btn" id="newChatBtn">＋ 新建对话</button>
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" placeholder="搜索历史对话…">
    </div>
    <div class="side-scroll">
      <div class="side-label"><span id="modelLabel">模型</span><span class="mini" id="addModelMini">＋ 添加</span></div>
      <div class="model-list" id="modelList"></div>
      <div class="side-label">最近对话<span class="mini" id="allHist">全部 ›</span></div>
      <div class="conv-list" id="convList"></div>
    </div>
    <div class="side-footer">
      <button id="skillsBtn">技能库</button>
      <button id="settingsBtn">设置</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="cur-model">
        <span id="curIcon"></span>
        <span id="curName" style="font-size:13.5px;font-weight:600">豆包</span>
        <span class="tag" id="curTag">未配置 Key</span>
      </div>
      <div class="seg">
        <button id="modeSingle" class="on">单模型</button>
        <button id="modeMulti">多模型协同</button>
        <button id="modeFlow">工作流</button>
        <button id="modeImage">生图</button>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="helpBtn" title="使用帮助"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 0 1 4.7 1c0 1.7-2.3 1.9-2.3 3.4"/><circle cx="12" cy="17.2" r=".9" fill="currentColor" stroke="none"/></svg></button>
        <button class="icon-btn" id="themeBtn" title="侧边栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap" id="composerWrap">
      <div class="multi-bar" id="multiBar" style="display:none"></div>
      <div class="flow-bar" id="flowBar" style="display:none"></div>
      <div class="skill-row" id="skillRow"></div>
      <div class="attach-row" id="attachRow" style="display:none"></div>
      <div class="mic-bar" id="micBar" style="display:none"></div>
      <div class="img-bar" id="imgBar" style="display:none"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="给 AI 发送消息…（Shift + Enter 换行）"></textarea>
        <div class="composer-bar">
          <div class="cb-left">
            <div class="sel-wrap"><select id="modelSelect"></select></div>
            <span class="cb-tag" id="imgTag" style="display:none"></span>
          </div>
          <div class="cb-right">
          <button class="icon-btn" id="attachBtn" title="添加附件（图片 / 文本 / PDF / Word）">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11.5l-7.6 7.6a4.5 4.5 0 01-6.4-6.4l8-8a3 3 0 014.3 4.3l-8 8a1.5 1.5 0 01-2.2-2.2l7.3-7.3"/></svg>
          </button>
          <button class="icon-btn" id="micBtn" title="语音输入（点一下开始说）">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><path d="M4.5 12h15M13 5.5l6.5 6.5L13 18.5"/></svg>
          </button>
          </div>
        </div>
      </div>
      <div class="hint" id="hintLine">API Key 只保存在本机 · 对话记录不上传任何服务器</div>
    </div>
  </main>
  <input type="file" id="filePicker" multiple style="display:none"
    accept="image/*,.txt,.md,.markdown,.csv,.json,.log,.py,.js,.ts,.html,.css,.xml,.yml,.yaml,.pdf,.docx">
</div>
<div id="modalRoot"></div>

<script>

/* ==========================================================================
   AI 聚合助手
   - 官方图标：assets/icons（来自各品牌官网 / simple-icons 官方矢量）
   - 请求统一走本地 /proxy 转发（规避 CORS）
   - 本地存储：配置、对话历史、技能
   ========================================================================== */

const PRESET_PROVIDERS = [
  {
    id:'doubao', name:'豆包', brand:'火山方舟 · 字节跳动',
    icon:'assets/icons/store_doubao.png', iconFit:'cover', color:'#3b6cf6',
    base:'https://ark.cn-beijing.volces.com/api/v3/chat/completions',
    model:'', models:[],
    modelTip:'填火山方舟控制台里「推理接入点」的 ID（ep-xxxx），或 doubao-seed-1-6-250615 这类模型名',
    keyUrl:'https://console.volcengine.com/ark', keyName:'API Key'
  },
  {
    id:'deepseek', name:'DeepSeek', brand:'杭州深度求索',
    icon:'assets/icons/store_deepseek.png', iconFit:'cover', color:'#4d6bfe',
    base:'https://api.deepseek.com/chat/completions',
    model:'deepseek-chat', models:['deepseek-chat','deepseek-reasoner'],
    keyUrl:'https://platform.deepseek.com/api_keys', keyName:'API Key'
  },
  {
    id:'qwen', name:'通义千问', brand:'阿里云百炼',
    icon:'assets/icons/store_qwen.png', iconFit:'cover', color:'#7c5cff',
    base:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
    model:'qwen-plus', models:['qwen-plus','qwen-turbo','qwen-max','qwen3-235b-a22b'],
    keyUrl:'https://bailian.console.aliyun.com/', keyName:'DashScope API Key'
  },
  {
    id:'kimi', name:'Kimi', brand:'月之暗面 Moonshot',
    icon:'assets/icons/store_kimi.png', iconFit:'cover', color:'#1f2329',
    base:'https://api.moonshot.cn/v1/chat/completions',
    model:'moonshot-v1-8k', models:['moonshot-v1-8k','moonshot-v1-32k','kimi-k2-0711-preview'],
    keyUrl:'https://platform.moonshot.cn/console/api-keys', keyName:'API Key'
  },
  {
    id:'zhipu', name:'智谱 GLM', brand:'智谱 AI · 清言',
    icon:'assets/icons/store_zhipu.png', iconFit:'cover', color:'#1273eb',
    base:'https://open.bigmodel.cn/api/paas/v4/chat/completions',
    model:'glm-4-flash', models:['glm-4-flash','glm-4-plus','glm-4.5'],
    keyUrl:'https://bigmodel.cn/usercenter/apikeys', keyName:'API Key'
  },
  {
    id:'openai', name:'ChatGPT', brand:'OpenAI',
    icon:'assets/icons/store_openai.png', iconFit:'cover', color:'#10a37f',
    base:'https://api.openai.com/v1/chat/completions',
    model:'gpt-4o-mini', models:['gpt-4o-mini','gpt-4o','gpt-4.1-mini'],
    keyUrl:'https://platform.openai.com/api-keys', keyName:'API Key'
  },
  {
    id:'custom', name:'自定义模型', brand:'任意 OpenAI 兼容接口',
    icon:'', iconFit:'contain', color:'#5a6272',
    base:'', model:'', models:[], mark:'+',
    modelTip:'OneAPI、中转站、Ollama、LM Studio 等任何兼容 /chat/completions 的服务都能接',
    keyUrl:'', keyName:'API Key'
  }
];

const DEFAULT_SKILLS = [
  {id:'s_polish', name:'文案润色', prompt:'你是一名资深中文编辑。在不改变原意的前提下润色用户内容：口语自然、去掉AI腔和套话、保留关键信息，直接输出润色后的文本。'},
  {id:'s_xhs', name:'小红书文案', prompt:'你是小红书爆款文案写手。输出：3个带emoji的标题备选、正文（分段、口语化、有情绪钩子、200-400字）、5-8个话题标签。'},
  {id:'s_code', name:'代码审查', prompt:'你是严格的代码审查者。先指出潜在 bug、边界问题和安全隐患（按严重程度排序），再给出可直接替换的修改代码，语言与原代码一致。'},
  {id:'s_trans', name:'中英翻译', prompt:'你是专业翻译。中文输入译成地道英文，英文输入译成自然中文。只输出译文，不做解释，专有名词保留原样。'},
  {id:'s_meeting', name:'会议纪要', prompt:'你是专业会议记录员。把用户提供的会议内容整理成：一句话结论、关键讨论点、待办事项（含责任人和时间）、风险提示。结构化输出中文。'}
];

const DEFAULT_FLOWS = [
  {
    id:'f_write', name:'写作流水线', desc:'初稿 → 挑问题 → 定稿',
    steps:[
      {name:'写初稿', provId:'deepseek', prompt:'你是写作者。根据任务要求，先输出结构清晰、内容完整的第一版稿子。不要客套，直接给正文。'},
      {name:'挑问题', provId:'kimi', prompt:'你是严格编辑。针对上一步的稿子，列出缺点与可改进点（结构 / 逻辑 / 表达 / 遗漏），按优先级排序，只提问题不要重写。'},
      {name:'改定稿', provId:'deepseek', prompt:'你是定稿编辑。结合上一步提出的问题，把稿子改成最终版。输出完整定稿，不要解释修改过程。'}
    ]
  },
  {
    id:'f_review', name:'方案评审', desc:'出方案 → 挑漏洞 → 收敛定案',
    steps:[
      {name:'出方案', provId:'qwen', prompt:'你是方案撰写者。给出一个可执行方案，包含目标、步骤、所需资源、主要风险。'},
      {name:'挑漏洞', provId:'deepseek', prompt:'你是反方评审。指出上一步方案里最可能失败的 3 个点，说明原因，并各给一句改法建议。'},
      {name:'收敛定案', provId:'qwen', prompt:'你是决策者。综合方案与批评意见，输出修正后的最终方案和一份可勾选的执行清单。'}
    ]
  },
  {
    id:'f_teach', name:'三遍讲透', desc:'概览 → 深入 → 出练习',
    steps:[
      {name:'先讲概览', provId:'doubao', prompt:'你是老师。用 5 句话把这个主题讲清楚，让零基础的人也能听懂，不堆术语。'},
      {name:'再讲深入', provId:'deepseek', prompt:'在概览基础上深入讲解：背后的原理、关键细节、新手常见误区。'},
      {name:'出练习', provId:'qwen', prompt:'根据前两步的讲解，出 5 道由浅入深的练习题，并附参考答案与解析。'}
    ]
  }
];

const K = {prov:'aihub_providers_v1', skill:'aihub_skills_v1', conv:'aihub_convs_v1', cur:'aihub_cur_v1', custom:'aihub_custom_v1', multi:'aihub_multi_v1', flow:'aihub_flows_v1', params:'aihub_params_v1', stats:'aihub_stats_v1'};
const load = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

let storedProviders = load(K.prov, {});
let customProviders  = load(K.custom, []);
let skills           = load(K.skill, DEFAULT_SKILLS);
let conversations    = load(K.conv, []);
let flows            = load(K.flow, DEFAULT_FLOWS);
let params           = Object.assign({temp:0.7, maxTokens:0, ctxTurns:8, tools:false,
  imgSize:'1024x1024', exportTheme:'deep', ttsVoice:'zh-CN-XiaoxiaoNeural', ttsRate:'+0%', searchKey:''},
  load(K.params, {}));
params.asr = Object.assign({engine:'browser', base:'', key:'', model:'FunAudioLLM/SenseVoiceSmall', lang:'zh'}, params.asr || {});
let stats            = Object.assign({calls:0, chars:0, imgs:0}, load(K.stats, {}));

function allProviders(){
  const list = PRESET_PROVIDERS.map(p => {
    const s = storedProviders[p.id] || {};
    return {...p, apiKey:s.apiKey||'', base:s.base||p.base, model:s.model||p.model||''};
  });
  customProviders.forEach(c => {
    const s = storedProviders[c.id] || {};

  });
  return list;
}

/* ---------- 图标 ---------- */
function iconHtml(p, cls){
  if(!p) return '<span class="av '+cls+'"></span>';
  if(p.icon){
    return `<span class="av ${cls}"><img class="${p.iconFit==='contain'?'contain':''}" src="${p.icon}" alt="${escAttr(p.name)}"></span>`;
  }
  return `<span class="av ${cls}" style="background:linear-gradient(135deg,${p.color},${shade(p.color,-25)})"><span class="mark">${escAttr(p.mark||'AI')}</span></span>`;
}
function shade(hex, pct){
  const n = parseInt((hex||'#5a6272').replace('#',''),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+Math.round(255*pct/100)));
  g=Math.max(0,Math.min(255,g+Math.round(255*pct/100)));
  b=Math.max(0,Math.min(255,b+Math.round(255*pct/100)));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escAttr = esc;

/* ---------- Markdown ---------- */
function md(src){
  src = src || '';
  const codes = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, body) => {
    codes.push('<pre><code>' + esc(body.replace(/\n$/,'')) + '</code></pre>');
    return '\u0000C' + (codes.length-1) + '\u0000';
  });
  src = esc(src);
  src = src.replace(/(?:^|\n)((?:\|.*\|\s*\n)+)/g, (m, block) => {
    const rows = block.trim().split('\n').filter(Boolean);
    if(rows.length < 2 || !/^\|?\s*:?-{2,}/.test(rows[1])) return m;
    const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c => c.trim());
    let html = '<table>';
    rows.forEach((r,i) => {
      if(i === 1 && /^\|?\s*:?-{2,}/.test(r)) return;
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + cells(r).map(c => '<'+tag+'>'+c+'</'+tag+'>').join('') + '</tr>';
    });
    return '\n' + html + '</table>\n';
  });
  src = src.replace(/^### (.*)$/gm,'<h3>$1</h3>')
             .replace(/^## (.*)$/gm,'<h2>$1</h2>')
             .replace(/^# (.*)$/gm,'<h1>$1</h1>')
             .replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
             .replace(/^(?:-{3,}|\*{3,})$/gm,'<hr>');
  src = src.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
             .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
             .replace(/`([^`\n]+)`/g,'<code>$1</code>')
             .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  src = src.replace(/((?:^[-*+] .*\n?)+)/gm, m => '<ul>' + m.trim().split('\n').map(l => '<li>'+l.replace(/^[-*+] /,'')+'</li>').join('') + '</ul>');
  src = src.replace(/((?:^\d+\. .*\n?)+)/gm, m => '<ol>' + m.trim().split('\n').map(l => '<li>'+l.replace(/^\d+\. /,'')+'</li>').join('') + '</ol>');
  src = src.split(/\n{2,}/).map(chunk => {
    chunk = chunk.trim();
    if(!chunk) return '';
    if(/^<(h1|h2|h3|ul|ol|pre|table|blockquote|hr)/.test(chunk) || /^\u0000C/.test(chunk)) return chunk;
    return '<p>' + chunk.replace(/\n/g,'<br>') + '</p>';
  }).join('');
  return src.replace(/\u0000C(\d+)\u0000/g, (m,i) => codes[+i]);
}

const fmtTime = ts => {
  const d = new Date(ts||0);
  const now = new Date();
  const same = d.toDateString() === now.toDateString();
  const p = n => String(n).padStart(2,'0');
  return same ? p(d.getHours())+':'+p(d.getMinutes()) : p(d.getMonth()+1)+'/'+p(d.getDate());
};

function convPreview(c){
  if(c.type === 'image'){
    const it = (c.items||[])[0];

    const r = (c.runs||[])[0];
    return (r && r.q) || '';
  }
  if(c.type === 'multi'){
    const t = (c.turns||[])[0];
    return (t && t.q) || '';
  }
  const m = (c.messages||[]).find(x => x.role === 'user');
  return m ? m.content : '';
}

  if(/\/v\d+$/.test(b)) return b + '/chat/completions';
  return b + '/chat/completions';
}

async function streamChat(prov, messages, onDelta, signal){
  const url = endpointOf(prov.base);
  if(!url) throw new Error('接口地址为空');
  if(!prov.apiKey) throw new Error(prov.name + ' 还没填 API Key');

  const res = await fetch('/proxy', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({url, apiKey:prov.apiKey, payload: chatPayload(prov, messages)}),
    signal
  });
  const ct = res.headers.get('content-type') || '';
  if(!res.ok){
    let m = '';
    try{ const j = await res.json(); m = j.error || JSON.stringify(j); }catch(e){ m = await res.text().catch(()=> ''); }
    throw new Error('HTTP ' + res.status + '：' + String(m).slice(0,500));
  }
  if(!ct.includes('text/event-stream')){
    const txt = await res.text();
    let out = '';
    try{
      const j = JSON.parse(txt);
      if(j.error) throw new Error(typeof j.error === 'string' ? j.error : (j.error.message || '接口返回错误'));
      out = (j.choices && j.choices[0] && ((j.choices[0].message||{}).content || '')) || '';
    }catch(e){ if(!out) throw new Error('返回解析失败：' + txt.slice(0,200)); }
    onDelta(out, true);
    return out;
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const blocks = buf.split('\n\n');
    buf = blocks.pop();
    for(const blk of blocks){
      for(const line of blk.split('\n')){
        const t = line.trim();
        if(!t.startsWith('data:')) continue;
        const d = t.slice(5).trim();
        if(d === '[DONE]') continue;
        try{
          const j = JSON.parse(d);
          const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
          const piece = delta.content || delta.reasoning_content || '';
          if(piece){ full += piece; onDelta(piece, false); }
        }catch(e){}
      }
    }
  }
  onDelta('', true);
  return full;
}

/* ---------- 单模型发送 ---------- */
async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text || state.streaming) return;
  if(state.mode === 'multi') return sendMulti(text);
  if(state.mode === 'flow') return sendFlow(text);
  if(state.mode === 'image') return sendImage(text);

  const p = getProv(state.curProvId);
  if(!isReady(p)){ openSettings(p.id); return; }

  let c = conversations.find(x => x.id === state.convId);
  if(!c || c.type !== 'single'){ c = newConvObj('single'); conversations.unshift(c); state.convId = c.id; }
  c.provId = state.curProvId; c.model = p.model;
  const att = takeAttachments(text);
  const fullText = text + att.extra;
  if(att.notes.length) toast(att.notes[0], 4200);
  if(!c.messages.length) c.title = text.slice(0,22);
  c.messages.push({role:'user', content:fullText, images:att.images, disp:text, refs:att.texts.map(t => t.name)});
  clearAtt();
  input.value = ''; input.style.height = 'auto';
  scrollLock = true;
  const aiMsg = {role:'assistant', content:''};
  c.messages.push(aiMsg);
  renderAll();

  state.streaming = true; setBusy(true);
  const ac = new AbortController(); state.acs = [ac];
  try{
    const sys = skills.filter(s => (c.skills||[]).includes(s.id)).map(s => s.prompt).join('\n\n');
    const msgs = contextMessages(c, sys);
    if(params.tools){
      aiMsg.tools = [];
      renderChat();
      const result = await runToolLoop(p, msgs, aiMsg.tools, () => renderChat());
      aiMsg.content = result.content || '（工具跑完了，模型没有给总结，可以再问一句「把结果整理一下」）';
    }else{
      await streamChat(p, msgs, (piece) => {
        if(piece){ aiMsg.content += piece; renderChat(); }
      }, ac.signal);
    }
    bumpStats(aiMsg.content.length, 0);
    if(!aiMsg.content.trim()){ aiMsg.content = '（模型没有返回内容，检查接口地址 / 模型名是否正确）'; aiMsg.error = true; }
  }catch(err){
    if(err.name === 'AbortError'){ if(!aiMsg.content) aiMsg.content = '已停止生成。'; }
    else { aiMsg.content = err.message || String(err); aiMsg.error = true; }
  }finally{
    state.streaming = false; state.acs = []; setBusy(false);
    persistConvs(); renderAll();
  }
}

/* ---------- 协同发送 ---------- */
async function sendMulti(text){
  const ids = state.multiIds.filter(id => isReady(getProv(id)));
  if(ids.length < 2){ toastMulti('协同模式至少需要 2 个已配置 Key 的模型（在左侧勾选或去设置填 Key）'); return; }

  const input = document.getElementById('input');
  let c = conversations.find(x => x.id === state.convId);
  if(!c || c.type !== 'multi'){ c = newConvObj('multi'); conversations.unshift(c); state.convId = c.id; }
  c.turns = c.turns || [];
  const turn = {
    id:'t_'+Date.now().toString(36),
    q:text, answers: ids.map(id => ({provId:id, model:getProv(id).model, content:'', error:false, done:false})),
    summary:null, sumProvId:null
  };
  c.turns.push(turn);
  if(!c.title || c.title === '新对话') c.title = '协同 · ' + text.slice(0,18);
  input.value = ''; input.style.height = 'auto';
  scrollLock = true;
  state.streaming = true; setBusy(true);
  renderAll();

  const ac = new AbortController(); state.acs = [ac];
  const sys = skills.filter(s => (c.skills||[]).includes(s.id)).map(s => s.prompt).join('\n\n');

  const jobs = turn.answers.map(async (ans) => {
    const p = getProv(ans.provId);
    const msgs = [];
    if(sys) msgs.push({role:'system', content:sys});
    msgs.push({role:'user', content:text});
    try{
      await streamChat(p, msgs, (piece) => {
        if(piece){ ans.content += piece; renderMultiChunk(turn, ans); }
      }, ac.signal);
      if(!ans.content.trim()){ ans.content = '（没有返回内容）'; ans.error = true; }
    }catch(err){
      if(err.name === 'AbortError'){ if(!ans.content) ans.content = '已停止'; }
      else { ans.content = err.message || String(err); ans.error = true; }
    }finally{
      ans.done = true;
      renderMultiChunk(turn, ans);
    }
  });

  await Promise.all(jobs);
  state.streaming = false; state.acs = []; setBusy(false);
  persistConvs(); renderAll();
}

/* ---------- 汇总 ---------- */
async function summarize(turnIdx){
  const c = conversations.find(x => x.id === state.convId);
  const t = (c.turns||[])[turnIdx]; if(!t) return;
  const sel = document.querySelector(`[data-sumsel="${turnIdx}"]`);
  const sumId = (sel && sel.value) || state.multiIds[0];
  const p = getProv(sumId);
  if(!isReady(p)){ openSettings(sumId); return; }

  state.streaming = true; setBusy(true);
  renderAll();
  const ac = new AbortController(); state.acs = [ac];
  t.sumProvId = sumId;

  let content = '';
  const blocks = t.answers.map((a,i) => {
    const nm = getProv(a.provId).name;
    return `【模型${i+1}：${nm}】\n${(a.content||'').slice(0,4000)}`;
  }).join('\n\n');

  const msgs = [
    {role:'system', content:'你是多模型协作中的「总编」。请对比下面多个模型对同一问题的回答，输出：1) 一句话结论；2) 各模型的核心观点与共识；3) 明显分歧或错误之处；4) 最终建议（可直接落地的版本）。用中文结构化输出，不要逐字复述原文。'},
    {role:'user', content:`问题：${t.q}\n\n各模型回答：\n\n${blocks}`}
  ];

  try{
    await streamChat(p, msgs, (piece) => {
      if(piece){ content += piece; t.summary = content; t.sumDone = false; renderMultiChunk(); }
    }, ac.signal);
    if(!content.trim()){ throw new Error('汇总模型没有返回内容'); }
    t.sumDone = true;
  }catch(err){
    if(err.name !== 'AbortError') t.summary = '汇总失败：' + (err.message || String(err));
    else if(!content) t.summary = '已停止汇总。';
  }finally{
    state.streaming = false; state.acs = []; setBusy(false);
    persistConvs(); renderAll();
  }
}

/* ---------- 请求参数与统计 ---------- */
function chatPayload(prov, messages){
  const p = {model:prov.model, messages, stream:true};
  if(typeof params.temp === 'number') p.temperature = params.temp;
  if(params.maxTokens > 0) p.max_tokens = params.maxTokens;
  return p;
}
function bumpStats(chars, imgs){
  stats.calls += 1;
  stats.chars += chars || 0;
  stats.imgs += imgs || 0;
  save(K.stats, stats);
}

function contextMessages(c, sys){
  const out = [];
  if(sys) out.push({role:'system', content:sys});
  let src = (c.messages||[]).filter(m => !m.error && (m.content || (m.images||[]).length));
  const lim = params.ctxTurns >= 999 ? src.length : params.ctxTurns * 2;
  if(src.length > lim) src = src.slice(-lim);
  src.forEach(m => {
    if(m.images && m.images.length){
      out.push({role:m.role, content:[{type:'text', text:m.content || '请看这张图'}].concat(
        m.images.map(u => ({type:'image_url', image_url:{url:u}})))});
    } else if(m.content){
      out.push({role:m.role, content:m.content});
    }
  });
  return out;
}

/* ---------- 附件 ---------- */
const TEXT_EXT = ['txt','md','markdown','csv','json','log','py','js','ts','jsx','html','htm','css','xml','yml','yaml','ini','bat'];
const MAX_IMG = 6;
const MAX_TEXT = 60000;

function loadScriptOnce(url){
  window.__scripts = window.__scripts || {};
  if(window.__scripts[url]) return window.__scripts[url];
  window.__scripts[url] = new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = url;
    el.onload = () => res(true);
    el.onerror = () => rej(new Error('加载失败'));
    document.head.appendChild(el);
  });
  return window.__scripts[url];
}
function readAsText(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f); }); }
function readAsBuf(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(f); }); }
function readAsUrl(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

function shrinkImage(dataUrl, maxSide){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const side = Math.max(img.width, img.height);
      if(side <= maxSide) return res(dataUrl);
      const k = maxSide / side;
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k);
      cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

async function handleFiles(files){
  for(const f of Array.from(files || [])){
    const name = f.name || '粘贴的图片';
    const ext = (name.indexOf('.') > -1 ? name.split('.').pop() : '').toLowerCase();
    const isImg = /^image\//.test(f.type) || ['png','jpg','jpeg','webp','gif','bmp'].includes(ext);
    try{
      if(isImg){
        if(state.att.filter(a => a.kind === 'image').length >= MAX_IMG){ toast('最多附 ' + MAX_IMG + ' 张图片'); continue; }
        const raw = await readAsUrl(f);
        state.att.push({kind:'image', name, dataUrl: await shrinkImage(raw, 1280)});
      } else if(ext === 'docx'){
        toast('正在解析 Word 文档…', 8000);
        await loadScriptOnce('https://fastly.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
        const out = await window.mammoth.extractRawText({arrayBuffer: await readAsBuf(f)});
        const txt = (out.value || '').trim();
        if(!txt){ toast('这个 Word 里没有可提取的文字（可能是扫描件）'); continue; }
        state.att.push({kind:'text', name, text: txt.slice(0, MAX_TEXT), size: txt.length});
      } else if(ext === 'pdf'){
        toast('正在解析 PDF…', 8000);
        await loadScriptOnce('https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
        const doc = await window.pdfjsLib.getDocument({data: await readAsBuf(f)}).promise;
        let txt = '';
        for(let i = 1; i <= doc.numPages && txt.length < MAX_TEXT; i++){
          const page = await doc.getPage(i);
          const ct = await page.getTextContent();
          txt += ct.items.map(it => it.str).join(' ') + '\n';
        }
        if(!txt.trim()){ toast('这个 PDF 没有可提取的文字（可能是扫描件）'); continue; }
        state.att.push({kind:'text', name, text: txt.slice(0, MAX_TEXT), size: txt.length});
      } else if(TEXT_EXT.includes(ext) || /^text\//.test(f.type)){
        const txt = await readAsText(f);
        if(!txt.trim()){ toast('文件是空的：' + name); continue; }
        state.att.push({kind:'text', name, text: txt.slice(0, MAX_TEXT), size: txt.length});
      } else {
        toast('暂不支持这个类型：' + name + '（支持图片 / txt / md / csv / json / pdf / docx）', 4500);
      }
    }catch(e){
      toast('读取失败：' + name);
    }
  }
  renderAttRow();
}

function renderAttRow(){
  const row = document.getElementById('attachRow');
  if(!state.att.length){ row.style.display = 'none'; row.innerHTML = ''; return; }
  row.style.display = 'flex';
  row.innerHTML = state.att.map((a, i) => {
    if(a.kind === 'image'){
      return `<div class="att-chip"><img src="${a.dataUrl}" alt=""><span class="nm">${esc(a.name)}</span><span class="rm" data-rmatt="${i}" title="移除">✕</span></div>`;
    }
    const kb = Math.round((a.size || a.text.length) / 1024 * 10) / 10;
    return `<div class="att-chip"><span class="nm">${esc(a.name)} · ${kb}KB</span><span class="rm" data-rmatt="${i}" title="移除">✕</span></div>`;
  }).join('');
}

function clearAtt(){ state.att = []; renderAttRow(); }

function takeAttachments(query){
  const texts = state.att.filter(a => a.kind === 'text');
  const images = state.att.filter(a => a.kind === 'image').map(a => a.dataUrl);
  let extra = '';
  const notes = [];
  texts.forEach(t => {
    if((t.text || '').length > 3600){
      const r = retrieve(query, t.text, t.name);
      extra += '\n\n【参考资料：' + t.name + '】' + r.note + '\n' + r.text;
      if(r.note) notes.push(r.note);
    }else{
      extra += '\n\n【参考资料：' + t.name + '】\n' + t.text;
    }
  });
  return {texts, images, extra, notes};
}

function stopMic(){

function toggleMic(){
  if(state.rec){ stopRec(); return; }
  if(state.mic){ stopMic(); return; }
  if(params.asr.engine === 'api'){ startRecApi(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('这个浏览器不支持语音识别，建议用 Edge 或 Chrome 打开'); return; }
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.interimResults = true;
  rec.continuous = true;
  const base = document.getElementById('input').value;
  let gotText = false;
  state.micGot = false;
  rec.onresult = (e) => {
    let fin = '', mid = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) fin += r[0].transcript; else mid += r[0].transcript;
    }
    const box = document.getElementById('input');
    box.value = (base + ' ' + fin + mid).replace(/^\s+/, '');
    if(fin || mid){ gotText = true; state.micGot = true; }
    autoGrow();
  };
  rec.onerror = (e) => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed')
      toast('麦克风权限被拒：点浏览器地址栏右边的图标允许麦克风', 5000);
    else if(e.error === 'network')
      toast('浏览器自带识别连不上云端（国内网络常被拦）→ 设置 → 语音与工具，把引擎改成第三方 API', 6000);
    else if(e.error !== 'aborted')
      toast('语音识别出错：' + e.error, 4000);
    stopMic();
  };
  rec.onend = () => {
    stopMic();
    if(!gotText && !state.micGot)
      toast('没识别到内容：浏览器自带识别在国内不稳定，建议改用第三方识别；或说得长一点再停', 5200);
  };
  state.mic = rec;
  document.getElementById('micBtn').classList.add('rec');
  try{ rec.start(); toast('开始收音，说完再点一次麦克风结束', 2400); }
  catch(e){ stopMic(); toast('麦克风启动失败：' + e.message); }
}

async function startRecApi(){

    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(e){
    toast('麦克风打不开：' + e.message, 4500);
    return;
  }
  const opts = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? {mimeType:'audio/webm;codecs=opus'}
    : (MediaRecorder.isTypeSupported('audio/webm') ? {mimeType:'audio/webm'} : {});
  state.rec = {stream, rec:null, acc:'', base:document.getElementById('input').value, stopped:false, busy:false};
  micT0 = Date.now();
  micTimer = null;
  document.getElementById('micBtn').classList.add('rec');
  micBarShow('正在收音 00:00 · 说完点「结束」', true);
  micTicker = setInterval(micTick, 700);

  const nextSeg = () => {
    const r = state.rec;
    if(!r || r.stopped) return;
    let recorder;
    try{ recorder = new MediaRecorder(stream, opts); }catch(e){ return; }
    r.rec = recorder;
    const parts = [];
    recorder.ondataavailable = e => { if(e.data && e.data.size) parts.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(parts, {type:recorder.mimeType || 'audio/webm'});
      if(blob.size > 300){
        const r2 = state.rec;
        if(r2) r2.busy = true;
        micBarShow('识别中…（' + (state.rec ? state.rec.acc.length : 0) + ' 字已上屏）', true);
        try{
          const text = await transcribeBlob(blob);
          if(text){
            state.rec.acc = (state.rec.acc ? state.rec.acc + '，' : '') + text;
            const box = document.getElementById('input');
            box.value = (state.rec.base ? state.rec.base + ' ' : '') + state.rec.acc;
            autoGrow();
          }
        }catch(e){
          toast('识别失败：' + e.message, 5000);
        }
        if(state.rec) state.rec.busy = false;
      }
      if(state.rec && !state.rec.stopped){
        micBarShow('正在收音，已识别 ' + state.rec.acc.length + ' 字，说完点「结束」', true);
        nextSeg();
      }else if(state.rec && state.rec.stopped){
        if(!state.rec.acc.length) toast('没识别到内容：说得太短或麦克风没收到音，多讲两句再点结束', 5000);
        micBarShow('识别完成，共 ' + state.rec.acc.length + ' 字', false);
        state.rec = null;
        setTimeout(micBarHide, 2600);
      }
    };
    recorder.start();
    micTimer = setTimeout(() => { try{ if(recorder.state === 'recording') recorder.stop(); }catch(e){} }, SEG_MS);
  };
  nextSeg();
}

  ['zh-CN-liaoning-XiaobeiNeural','晓北 · 东北口音'],
  ['zh-CN-shaanxi-XiaoniNeural','晓妮 · 陕西口音']
];
let ttsAudio = null, ttsCurBtn = null;

async function speak(text, btn){
  if(ttsAudio){
    const wasSame = ttsCurBtn === btn;
    ttsAudio.pause();
    ttsAudio = null;
    if(ttsCurBtn) ttsCurBtn.textContent = '朗读';
    ttsCurBtn = null;
    if(wasSame) return;
  }
  btn.textContent = '合成中…';
  try{
    const res = await fetch('/tts', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, voice:params.ttsVoice, rate:params.ttsRate})});
    if(!(res.headers.get('Content-Type') || '').startsWith('audio')){
      let msg = '语音合成失败';
      try{ const j = await res.json(); msg = j.error || msg; }catch(e){}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    ttsAudio = new Audio(url);
    ttsCurBtn = btn;
    btn.textContent = '停止';
    ttsAudio.onended = () => {
      if(ttsCurBtn === btn) ttsCurBtn.textContent = '朗读';
      ttsAudio = null; ttsCurBtn = null;
      URL.revokeObjectURL(url);
    };
    await ttsAudio.play();
  }catch(e){
    btn.textContent = '朗读';
    alert('朗读失败：' + e.message);
  }
}

async function callTool(name, args){
  args = args || {};
  if(name === 'web_search'){
    const r = await fetch('/tool/search', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query:args.query, key:params.searchKey || ''})});
    const j = await r.json();
    if(j.error) return {error:j.error, hint:j.hint||''};
    return {engine:j.engine, results:(j.results || []).slice(0, 6).map(x => ({title:x.title, url:x.url, snippet:x.snippet}))};
  }
  if(name === 'fetch_url'){
    const r = await fetch('/tool/fetch', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url:args.url})});
    return await r.json();
  }
  if(name === 'calc'){
    const r = await fetch('/tool/calc', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({expr:args.expr})});
    return await r.json();
  }
  if(name === 'list_files'){
    const r = await fetch('/tool/fs', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'list'})});
    return await r.json();
  }
  if(name === 'read_file'){
    const r = await fetch('/tool/fs', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'read', path:args.path})});
    return await r.json();
  }
  if(name === 'write_file'){
    const r = await fetch('/tool/fs', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'write', path:args.path, content:args.content, append:!!args.append})});
    return await r.json();
  }
  return {error:'没有这个工具：' + name};
}

function toolLabel(name, args){
  const m = TOOL_META[name] || {ic:'🛠', label:name};
  let detail = '';
  if(args){
    if(name === 'web_search') detail = args.query || '';
    else if(name === 'fetch_url') detail = (args.url || '').slice(0, 46);
    else if(name === 'calc') detail = args.expr || '';
    else if(name === 'read_file' || name === 'write_file') detail = args.path || '';
  }
  return {ic:m.ic, label:m.label, detail:detail};
}

function renderToolTrace(tools){
  if(!tools || !tools.length) return '';
  return '<div class="tool-trace">' + tools.map(t => {
    const meta = toolLabel(t.name, t.args);
    return '<div class="tl ' + (t.err ? 'run' : 'done') + '"><span class="ic">' + meta.ic + '</span>'
      + '<span><b>' + esc(meta.label) + '</b>' + (meta.detail ? '：' + esc(meta.detail) : '')
      + (t.err ? ' <span style="color:#ff9b9b">（失败：' + esc(t.err) + '）</span>' : '') + '</span></div>';
  }).join('') + '</div>';
}

async function runToolLoop(p, msgs, tools, onStep){
  const url = endpointOf(p.base);
  const maxRounds = 4;
  for(let round = 0; round < maxRounds; round++){
    const payload = {model:p.model, messages:msgs, tools:TOOL_DEFS, tool_choice:'auto',
      stream:false, temperature:params.temp};
    if(params.maxTokens > 0) payload.max_tokens = params.maxTokens;
    const res = await fetch('/proxy', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url, apiKey:p.apiKey, payload})});
    const txt = await res.text();
    let j = null;
    try{ j = JSON.parse(txt); }catch(e){ throw new Error('返回无法解析：' + txt.slice(0, 160)); }
    if(j.error) throw new Error(typeof j.error === 'string' ? j.error : (j.error.message || '接口返回错误'));
    const choice = (j.choices || [])[0] || {};
    const msg = choice.message || {};
    const calls = msg.tool_calls || [];
    if(!calls.length) return {content:msg.content || '', tools};
    msgs.push({role:'assistant', content:msg.content || '', tool_calls:calls});
    for(const tc of calls){
      const fn = tc.function || {};
      let args = {};
      try{ args = JSON.parse(fn.arguments || '{}'); }catch(e){ args = {}; }
      const meta = toolLabel(fn.name, args);
      const step = {name:fn.name, args, err:'', id:tc.id, title:meta.label, detail:meta.detail};
      tools.push(step);
      if(onStep) onStep(step, 'run');
      let out;
      try{ out = await callTool(fn.name, args); }
      catch(e){ out = {error:e.message}; }
      if(out && out.error) step.err = out.error;
      if(onStep) onStep(step, 'done');
      msgs.push({role:'tool', tool_call_id:tc.id,
        content: JSON.stringify(out).slice(0, 6000)});
    }
  }
  throw new Error('工具已经连续调用了 ' + maxRounds + ' 轮，先停一下，把问题拆小一点再问');
}

/* ================= 长文档：切片 + 关键词检索 ================= */
const CHUNK_SIZE = 700;
const MAX_PIECES = 4;

function splitDoc(text){
  const paras = String(text || '').split(/\n\s*\n/).filter(p => p.trim());
  const pieces = [];
  let buf = '';
  const push = () => { if(buf.trim()) pieces.push(buf.trim()); buf = ''; };
  for(const p of paras){
    if(p.length > CHUNK_SIZE * 1.6){
      const sents = p.split(/(?<=[。！？；.!?])\s*/).filter(Boolean);
      for(const s of sents){
        if((buf + s).length > CHUNK_SIZE) push();
        buf += s;
      }
    }else if((buf + p).length > CHUNK_SIZE) { push(); buf = p; }
    else buf += (buf ? '\n\n' : '') + p;
  }
  push();
  return pieces.length ? pieces : [String(text || '').slice(0, CHUNK_SIZE)];
}

function docScore(piece, terms){
  const t = piece.toLowerCase();
  let hit = 0;
  for(const w of terms){ if(w && t.indexOf(w) > -1) hit += Math.min(w.length, 4); }
  return hit;
}

function retrieve(query, text, name){
  const pieces = splitDoc(text);
  if(pieces.length <= MAX_PIECES + 1 || !query){
    return {text:pieces.slice(0, MAX_PIECES + 1).join('\n\n'), note:'', total:pieces.length, picked:Math.min(pieces.length, MAX_PIECES + 1)};
  }
  const terms = [];
  const q = String(query || '').toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g, ' ');
  q.split(/\s+/).filter(w => w.length >= 2).forEach(w => terms.push(w));
  const han = q.replace(/[^\u4e00-\u9fa5]/g, '');
  for(let i = 0; i < han.length - 1; i++) terms.push(han.slice(i, i + 2));
  const scored = pieces.map((p, i) => ({i, p, s:docScore(p, terms) + (i === 0 ? 3 : 0)}));
  scored.sort((a, b) => b.s - a.s);
  const picked = scored.slice(0, MAX_PIECES).sort((a, b) => a.i - b.i);
  return {text:picked.map(x => x.p).join('\n\n'), note:'（《' + name + '》共 ' + pieces.length + ' 段，按你的问题挑了最相关的 ' + picked.length + ' 段）',
    total:pieces.length, picked:picked.length};
}

async function sendImage(prompt){

  if(!c || c.type !== 'image'){ c = newConvObj('image'); conversations.unshift(c); state.convId = c.id; }
  c.items = c.items || [];
  const dft = IMG_DEFAULT[p.id] || {};
  const model = dft.model || p.model || 'gpt-image-1';
  const item = {id:'g_' + Date.now().toString(36), q:prompt, provId:p.id, model, url:'', err:'', done:false};
  c.items.push(item);
  if(!c.title || c.title === '新对话') c.title = '生图 · ' + prompt.slice(0, 16);

  document.getElementById('input').value = '';
  autoGrow();
  state.streaming = true; setBusy(true);
  renderAll();

  const size = params.imgSize || dft.size || '1024x1024';
  const payload = {model, prompt, n:1, size};
  try{
    let res, txt;
    if(state.imgRef){
      item.editFrom = state.imgRef.url;
      const base = imageEndpointOf(p) || '';
      const editUrl = base.replace(/\/images\/generations$/, '/images/edits');
      res = await fetch('/imgedit', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url:editUrl, apiKey:p.apiKey, model, prompt, size,
          image: state.imgRef.url.startsWith('data:') ? state.imgRef.url : '',
          imageUrl: state.imgRef.url.startsWith('data:') ? '' : state.imgRef.url})});
      txt = await res.text();
    }else{
      res = await fetch('/proxy', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url, apiKey:p.apiKey, payload})
      });
      txt = await res.text();
    }
    let j = null;
    try{ j = JSON.parse(txt); }catch(e){ throw new Error('返回无法解析：' + txt.slice(0, 160)); }
    if(j.error) throw new Error(typeof j.error === 'string' ? j.error : (j.error.message || '接口返回错误'));
    const first = (j.data && j.data[0]) || {};
    const src = first.url || (first.b64_json ? 'data:image/png;base64,' + first.b64_json : '');
    if(!src) throw new Error('接口没有返回图片：' + JSON.stringify(j).slice(0, 200));
    item.url = src;
    bumpStats(0, 1);
  }catch(e){
    item.err = e.message || String(e);
  }
  item.done = true;
  state.streaming = false; setBusy(false);
  persistConvs(); renderAll();
  const sc = document.getElementById('chatScroll');
  if(sc) setTimeout(() => { sc.scrollTop = 0; }, 60);
}

/* ---------- 工作流：运行 ---------- */
function buildStepUser(task, ref, prev){
  let out = '任务：' + task;
  if(ref) out += '\n\n参考资料：\n' + ref;
  if(prev) out += '\n\n上一步的产出（请在此基础上继续）：\n' + prev;
  return out;
}

async function sendFlow(text){
  const wf = getFlow(state.flowId);
  const ready = allProviders().filter(isReady);
  if(!wf || !wf.steps.length || !ready.length){ openSettings(); return; }

  const input = document.getElementById('input');
  let c = conversations.find(x => x.id === state.convId);
  if(!c || c.type !== 'flow'){ c = newConvObj('flow'); conversations.unshift(c); state.convId = c.id; }
  c.runs = c.runs || [];
  c.flowId = wf.id;
  const run = {
    id:'r_' + Date.now().toString(36),
    q:text, ref:c.refText || '', flowName:wf.name,
    steps: wf.steps.map(s => ({name:s.name, provId:s.provId, prompt:s.prompt, model:'', content:'', error:false, done:false, note:''}))
  };
  c.runs.push(run);
  if(!c.title || c.title === '新对话') c.title = wf.name + ' · ' + text.slice(0, 16);
  input.value = ''; input.style.height = 'auto';
  scrollLock = true;
  state.streaming = true; setBusy(true);
  renderAll();

  const ac = new AbortController(); state.acs = [ac];
  let prev = '';
  for(const st of run.steps){
    let p = getProv(st.provId);
    if(!isReady(p)){
      const alt = ready[0];
      st.note = '该步骤模型未配置，已用 ' + alt.name + ' 代替';
      p = alt;
    }
    st.provId = p.id; st.model = p.model; st.done = false;
    renderChat();
    const userMsg = buildStepUser(text, run.ref, prev);
    const msgs = st.prompt
      ? [{role:'system', content:st.prompt}, {role:'user', content:userMsg}]
      : [{role:'user', content:userMsg}];
    try{
      await streamChat(p, msgs, (piece) => { if(piece){ st.content += piece; renderMultiChunk(); } }, ac.signal);
      if(!st.content.trim()){ st.content = '（没有返回内容）'; st.error = true; }
      st.done = true;
      prev = st.content;
    }catch(err){
      st.done = true;
      if(err.name === 'AbortError'){ st.content = st.content || '已停止'; st.aborted = true; }
      else { st.content = err.message || String(err); st.error = true; }
      renderMultiChunk();
      break;
    }finally{
      st.done !== undefined && renderMultiChunk();
    }
  }
  state.streaming = false; state.acs = []; setBusy(false);
  persistConvs(); renderAll();
}

function renderFlowConv(c){
  return (c.runs || []).map(run => {
    const steps = (run.steps || []).map((st, i) => {
      const p = getProv(st.provId);
      const isLast = i === run.steps.length - 1;
      const body = st.error
        ? `<div class="err-box" style="font-size:12px">${esc(st.content)}</div>`
        : `<div class="bubble">${md(st.content)}${(!st.done && state.streaming) ? '<span class="cursor"></span>' : ''}</div>`;
      const stTxt = st.done ? (st.error ? '失败' : (st.aborted ? '已停止' : (isLast ? '成品' : '完成'))) : '运行中…';
      return `<div class="flow-step ${isLast ? 'final' : ''}">
        <div class="fs-rail"><span class="fs-num">${i + 1}</span></div>
        <div class="fs-body">
          <div class="fs-hd">
            ${iconHtml(p,'tiny')}
            <span class="nm">${esc(st.name)}</span>
            <span class="mdl">${esc(p.name)} ${esc(st.model || p.model || '')}${st.note ? ' · ' + esc(st.note) : ''}</span>
            <span class="st">${stTxt}</span>
          </div>
          <div class="fs-bd">${body}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="turn">
      <div class="msg user"><div class="bubble">${esc(run.q)}</div></div>
      ${run.ref ? `<div style="font-size:11.5px;color:var(--sub2);padding-left:4px">已附带参考资料 ${esc(run.ref.slice(0, 40))}…</div>` : ''}
      <div class="flow-card">${steps || '<div class="empty-tip">这个工作流没有步骤</div>'}</div>
    </div>`;
  }).join('');
}

function firstReadyId(i){
  const list = allProviders().filter(isReady);
  return (list[i % Math.max(list.length, 1)] || {}).id || 'deepseek';
}

function bindFlowTab(){
  document.querySelectorAll('[data-fname]').forEach(i => i.onchange = () => {
    const f = flows.find(x => x.id === i.dataset.fname);
    if(f){ f.name = i.value.trim() || f.name; save(K.flow, flows); renderTop(); }
  });
  document.querySelectorAll('[data-sname2]').forEach(i => i.onchange = () => {
    const [fid, si] = i.dataset.sname2.split('|');
    const f = flows.find(x => x.id === fid);
    if(f && f.steps[+si]){ f.steps[+si].name = i.value.trim() || f.steps[+si].name; save(K.flow, flows); renderTop(); }
  });
  document.querySelectorAll('[data-sprompt2]').forEach(i => i.onchange = () => {
    const [fid, si] = i.dataset.sprompt2.split('|');
    const f = flows.find(x => x.id === fid);
    if(f && f.steps[+si]){ f.steps[+si].prompt = i.value; save(K.flow, flows); }
  });
  document.querySelectorAll('[data-sprov]').forEach(sel => sel.onchange = () => {
    const [fid, si] = sel.dataset.sprov.split('|');
    const f = flows.find(x => x.id === fid);
    if(f && f.steps[+si]){ f.steps[+si].provId = sel.value; save(K.flow, flows); renderTop(); }
  });
  document.querySelectorAll('[data-delstep]').forEach(b => b.onclick = () => {
    const [fid, si] = b.dataset.delstep.split('|');
    const f = flows.find(x => x.id === fid);
    if(f && f.steps.length > 1){
      f.steps.splice(+si, 1);
      save(K.flow, flows);
      document.getElementById('setBody').innerHTML = flowTab(); bindFlowTab(); renderTop();
    }
  });
  document.querySelectorAll('[data-addstep]').forEach(b => b.onclick = () => {
    const f = flows.find(x => x.id === b.dataset.addstep);
    if(f){
      f.steps.push({name:'新步骤', provId:firstReadyId(f.steps.length), prompt:''});
      save(K.flow, flows);
      document.getElementById('setBody').innerHTML = flowTab(); bindFlowTab(); renderTop();
    }
  });
  document.querySelectorAll('[data-delflow]').forEach(b => b.onclick = () => {
    if(!confirm('删除这个工作流？')) return;
    flows = flows.filter(x => x.id !== b.dataset.delflow);
    save(K.flow, flows);
    if(!getFlow(state.flowId)) state.flowId = '';
    document.getElementById('setBody').innerHTML = flowTab(); bindFlowTab(); renderAll();
  });
  const add = document.getElementById('addFlow');
  if(add) add.onclick = () => {
    flows.push({id:'f_' + Date.now().toString(36), name:'新工作流', desc:'', steps:[
      {name:'第一步', provId:firstReadyId(0), prompt:''},
      {name:'第二步', provId:firstReadyId(1), prompt:'基于上一步的产出，改进并输出最终版。'}
    ]});
    save(K.flow, flows);
    document.getElementById('setBody').innerHTML = flowTab(); bindFlowTab(); renderTop();
  };
}

function bindSettings(){
  const read = id => {
    const k = document.querySelector('[data-apikey="'+id+'"]');
    const b = document.querySelector('[data-base="'+id+'"]');
    const m = document.querySelector('[data-model="'+id+'"]');
    if(!k) return null;
    return {key:k.value.trim(), base:b.value.trim(), model:m.value.trim()};
  };
  document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.save, v = read(id); if(!v) return;
    storedProviders[id] = {apiKey:v.key, base:v.base, model:v.model};
    save(K.prov, storedProviders);
    const c = conversations.find(x => x.id === state.convId);
    if(c && c.type !== 'multi' && c.provId === id) c.model = v.model;
    const card = btn.closest('.api-card'), badge = card.querySelector('.badge'), p = getProv(id);
    badge.textContent = isReady(p) ? '已配置' : '未配置';
    badge.className = 'badge ' + (isReady(p) ? 'ok' : '');
    renderAll();
    const r = document.getElementById('tr_' + id);
    if(r) r.innerHTML = '<span style="color:var(--ok)">已保存</span>';
    persistConvs();
  });
  document.querySelectorAll('[data-test]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.test, v = read(id); if(!v) return;
    const out = document.getElementById('tr_' + id);
    out.innerHTML = '<span style="color:var(--sub)">正在测试…</span>';
    try{
      if(!v.key || !v.model) throw new Error('先填 API Key 和模型名');
      const res = await fetch('/proxy', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url:endpointOf(v.base), apiKey:v.key, payload:{model:v.model, messages:[{role:'user',content:'ping'}], stream:false, max_tokens:8}})
      });
      if(!res.ok){
        let m=''; try{ const j=await res.json(); m = j.error||JSON.stringify(j); }catch(e){ m = await res.text().catch(()=>''); }
        throw new Error('HTTP ' + res.status + ' · ' + String(m).slice(0,220));
      }
      const j = await res.json();
      const txt = (j.choices && j.choices[0] && ((j.choices[0].message||{}).content || '')) || '(已返回)';
      out.innerHTML = '<span style="color:var(--ok)">连接成功 · ' + esc(String(txt).slice(0,80)) + '</span>';
    }catch(err){
      out.innerHTML = '<span style="color:var(--err)">' + esc(err.message || String(err)) + '</span>';
    }
  });
  document.querySelectorAll('[data-delprov]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.delprov;
    if(!confirm('删除这个自定义模型？')) return;
    customProviders = customProviders.filter(x => x.id !== id);
    delete storedProviders[id];
    save(K.custom, customProviders); save(K.prov, storedProviders);
    document.getElementById('setBody').innerHTML = apiTab(); bindSettings(); renderAll();
  });
  const add = document.getElementById('addCustomProv');
  if(add) add.onclick = () => {
    const id = 'x_' + Date.now().toString(36);
    customProviders.push({id, name:'新模型', brand:'自定义 OpenAI 兼容', icon:'', iconFit:'contain', mark:'AI', color:'#5a6272', base:'', model:'', models:[], keyUrl:'', keyName:'API Key', modelTip:'填完整接口地址（…/chat/completions）与模型名'});
    save(K.custom, customProviders);
    document.getElementById('setBody').innerHTML = apiTab(); bindSettings(); renderAll();
  };
}

function convsToMarkdown(){
  return conversations.map(c => {
    const lines = ['## ' + (c.title||'新对话'), '', '> ' + new Date(c.ts||Date.now()).toLocaleString() + ' · ' + (c.type === 'multi' ? '多模型协同' : getProv(c.provId).name), ''];
    if(c.type === 'image'){
      (c.items||[]).forEach(it => {
        lines.push('**描述：** ' + it.q, '');
        if(it.url) lines.push('![生成的图片](' + (it.url.startsWith('data:') ? '' : it.url) + ')', '');
        if(it.err) lines.push('> 失败：' + it.err, '');
      });
    }else if(c.type === 'flow'){
      (c.runs||[]).forEach(r => {
        lines.push('**任务：** ' + r.q, '');
        if(r.ref) lines.push('> 参考资料：' + r.ref, '');
        (r.steps||[]).forEach(st => lines.push('**' + st.name + '（' + getProv(st.provId).name + '）：**', st.content || '', ''));
      });
    }else if(c.type === 'multi'){
      (c.turns||[]).forEach(t => {
        lines.push('**问：** ' + t.q, '');
        t.answers.forEach(a => lines.push('**' + getProv(a.provId).name + '：**', a.content, ''));
        if(t.summary) lines.push('**汇总结论：**', t.summary, '');
      });
    }else{
      (c.messages||[]).forEach(m => lines.push((m.role === 'user' ? '**我：** ' : '**' + getProv(c.provId).name + '：**'), m.content, ''));
    }
    return lines.join('\n');
  }).join('\n\n---\n\n');
}
function download(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  document.getElementById('histExport').onclick = () => download('AI对话记录.md', convsToMarkdown());
  bindHist();

    document.querySelectorAll('[data-hopenc]').forEach(b => b.onclick = () => {
      openConv(b.dataset.hopenc); closeModal();

    document.querySelectorAll('[data-hren]').forEach(b => b.onclick = () => {

      persistConvs(); renderAll(); reDraw(document.getElementById('histSearch').value);
    });
  }
}
