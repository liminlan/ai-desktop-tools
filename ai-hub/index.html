  }
});

document.getElementById('chatInner').addEventListener('click', e => {
  const card = e.target.closest('[data-prov]');
  if(card && !state.streaming){
    if(state.mode === 'multi'){
      const id = card.dataset.prov;
      state.multiIds = state.multiIds.includes(id) ? state.multiIds.filter(x=>x!==id) : state.multiIds.concat([id]);
      save(K.multi, state.multiIds); renderAll();
    }else selectProv(card.dataset.prov);
    return;
  }
  const sumBtn = e.target.closest('[data-sum]');
  if(sumBtn){ summarize(+sumBtn.dataset.sum); return; }
  const copy = e.target.closest('[data-copy]');
  if(copy){
    const c = conversations.find(x => x.id === state.convId);
    navigator.clipboard.writeText(c.messages[+copy.dataset.copy].content).then(() => {
      copy.textContent = '已复制'; setTimeout(() => copy.textContent = '复制', 1200);
    });
    return;
  }
  const regen = e.target.closest('[data-regen]');
  if(regen && !state.streaming){
    const c = conversations.find(x => x.id === state.convId);
    while(c.messages.length && c.messages[c.messages.length-1].role === 'assistant') c.messages.pop();
    const last = c.messages[c.messages.length-1];
    if(last && last.role === 'user'){
      c.messages.pop();
      document.getElementById('input').value = last.disp || last.content;
      send();
    }
  }
});
document.getElementById('convList').addEventListener('click', e => {
  const del = e.target.closest('[data-delowl]');
  if(del){
    e.stopPropagation();
    conversations = conversations.filter(x => x.id !== del.dataset.delowl);
    if(state.convId === del.dataset.delowl) state.convId = conversations[0] ? conversations[0].id : null;
    persistConvs(); renderAll();
    return;
  }
  const ren = e.target.closest('[data-rename]');
  if(ren){
    e.stopPropagation();
    const c = conversations.find(x => x.id === ren.dataset.rename);
    const t = prompt('重命名对话：', c.title || '');
    if(t != null && t.trim()){ c.title = t.trim(); persistConvs(); renderAll(); }
    return;
  }
  const item = e.target.closest('[data-conv]');
  if(item) openConv(item.dataset.conv);
});
document.getElementById('searchInput').oninput = e => {
  state.search = e.target.value;
  renderSidebar();
};
document.getElementById('skillRow').addEventListener('click', e => {
  if(e.target.closest('[data-skill-mgr]')){ document.getElementById('skillsBtn').click(); return; }
  const chip = e.target.closest('[data-skill]'); if(!chip) return;
  const c = currentConv();
  const id = chip.dataset.skill;
  c.skills = c.skills || [];
  c.skills = c.skills.includes(id) ? c.skills.filter(x => x !== id) : c.skills.concat([id]);
  persistConvs(); renderSkillsRow();
});

const inputEl = document.getElementById('input');
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 190) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
document.getElementById('sendBtn').onclick = () => {
  if(state.streaming){ state.acs.forEach(a => { try{ a.abort(); }catch(e){} }); return; }
  send();
};
document.getElementById('modelSelect').onchange = e => selectProv(e.target.value);
document.getElementById('chatScroll').addEventListener('scroll', () => {
  const box = document.getElementById('chatScroll');
  scrollLock = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
});

function selectProv(id){
  state.curProvId = id;
  save(K.cur, {provId:id, mode:state.mode});
  const p = getProv(id);
  const c = conversations.find(x => x.id === state.convId);
  if(c && c.type !== 'multi' && (c.messages||[]).length === 0){ c.provId = id; c.model = p.model; }
  renderAll();
  if(!isReady(p)) openSettings(id);
  else if(window.innerWidth <= 860) document.getElementById('sidebar').classList.remove('open');
}

/* ---------- 启动 ---------- */
(function init(){
  conversations = conversations.map(c => {
    c.type = c.type || 'single';
    c.messages = c.messages || [];
    c.turns = c.turns || [];
    c.skills = c.skills || [];
    c.runs = c.runs || [];
    return c;
  });
  if(!conversations.length) conversations.unshift(newConvObj(state.mode));
  state.convId = conversations[0].id;
  if(!state.multiIds.length) state.multiIds = allProviders().filter(isReady).slice(0,3).map(p => p.id);
  renderAll();
})();

</script>
</body>
</html>
